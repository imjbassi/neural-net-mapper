<svg viewBox="0 0 980 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="420" fill="#ffffff"/>

  <!-- Stage 1: Dataset -->
  <rect x="20" y="150" width="170" height="110" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="105" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">generate_dataset.py</text>
  <text x="105" y="202" text-anchor="middle" font-size="12" fill="#4338ca">Synthetic shapes</text>
  <text x="105" y="220" text-anchor="middle" font-size="12" fill="#4338ca">(circle / square /</text>
  <text x="105" y="238" text-anchor="middle" font-size="12" fill="#4338ca">triangle), 32x32</text>

  <!-- Arrow 1 -->
  <line x1="190" y1="205" x2="248" y2="205" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Model -->
  <rect x="250" y="140" width="180" height="130" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="340" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#0e7490">model.py</text>
  <text x="340" y="190" text-anchor="middle" font-size="12" fill="#155e75">ShapeMLP</text>
  <text x="340" y="208" text-anchor="middle" font-size="12" fill="#155e75">Linear + ReLU</text>
  <text x="340" y="226" text-anchor="middle" font-size="12" fill="#155e75">+ Dropout layers</text>
  <text x="340" y="244" text-anchor="middle" font-size="12" fill="#155e75">Kaiming init</text>

  <!-- Arrow 2 -->
  <line x1="430" y1="205" x2="488" y2="205" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Train -->
  <rect x="490" y="130" width="190" height="150" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="585" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#713f12">train.py</text>
  <text x="585" y="180" text-anchor="middle" font-size="12" fill="#854d0e">Training loop</text>
  <text x="585" y="198" text-anchor="middle" font-size="12" fill="#854d0e">Forward-pass capture:</text>
  <text x="585" y="216" text-anchor="middle" font-size="12" fill="#854d0e">activations, weights,</text>
  <text x="585" y="234" text-anchor="middle" font-size="12" fill="#854d0e">dropout masks,</text>
  <text x="585" y="252" text-anchor="middle" font-size="12" fill="#854d0e">loss / accuracy</text>

  <!-- Arrow 3 -->
  <line x1="680" y1="205" x2="738" y2="205" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Snapshots -->
  <rect x="740" y="165" width="150" height="80" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="815" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">snapshots.npz</text>
  <text x="815" y="215" text-anchor="middle" font-size="12" fill="#374151">per-epoch state</text>

  <!-- Arrow down -->
  <line x1="815" y1="245" x2="815" y2="303" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5: Visualize -->
  <rect x="600" y="305" width="290" height="95" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="745" y="333" text-anchor="middle" font-size="14" font-weight="600" fill="#831843">visualize.py</text>
  <text x="745" y="355" text-anchor="middle" font-size="12" fill="#9d174d">Animates input, network diagram,</text>
  <text x="745" y="373" text-anchor="middle" font-size="12" fill="#9d174d">loss/accuracy curves &amp; class probs</text>
  <text x="745" y="391" text-anchor="middle" font-size="12" fill="#9d174d">→ outputs/animation.mp4|gif</text>

  <!-- Arrow back to visualize from dataset area (re-render path) -->
  <line x1="600" y1="352" x2="200" y2="352" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="20" y="305" width="180" height="95" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="110" y="333" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">main.py</text>
  <text x="110" y="355" text-anchor="middle" font-size="12" fill="#166534">Orchestrates train</text>
  <text x="110" y="373" text-anchor="middle" font-size="12" fill="#166534">then visualize</text>
  <text x="110" y="391" text-anchor="middle" font-size="11" fill="#166534">(python -m src.main)</text>

  <line x1="815" y1="245" x2="815" y2="305" stroke="#6b7280" stroke-width="0" />

  <!-- Title -->
  <text x="490" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">neural-net-mapper Pipeline</text>
  <text x="490" y="62" text-anchor="middle" font-size="13" fill="#6b7280">data → model → train (capture snapshots) → visualize (render animation)</text>
</svg>
