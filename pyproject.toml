[project]
name = "neural-net-mapper"
version = "1.0.0"
description = "Train an MLP on synthetic shapes and animate its inner workings: activations, weights, dropout, and training metrics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0.0",
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
    "Pillow>=9.0.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
video = ["imageio-ffmpeg>=0.4"]  # bundled ffmpeg for MP4 export

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
